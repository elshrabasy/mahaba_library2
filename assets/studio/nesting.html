<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مهابة الفن | استوديو المونتاج</title>
<style>
:root{--navy:#112d3e;--teal:#05848a;--gold:#c5a45d;--muted:#607887;--border:#dae3e8}*{box-sizing:border-box}body{margin:0;background:#edf2f5;color:var(--navy);font:13px Tahoma,Arial,sans-serif}.wrap{display:grid;grid-template-columns:315px minmax(0,1fr);gap:14px;padding:14px}.side,.panel{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px}.side{overflow:auto}h2{font-size:18px;margin:0 0 8px}h3{font-size:12px;margin:18px 0 9px}.small{font-size:10px;color:var(--muted);line-height:1.8}.fields{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{display:grid;gap:5px}.field span{font-size:10px;color:#506b7a}.field input,.field select{width:100%;border:1px solid #cbd8df;border-radius:7px;padding:8px;background:#fff}.full{grid-column:1/-1}button{font-family:inherit;border:1px solid var(--border);border-radius:8px;padding:9px 11px;background:#f8fafb;color:var(--navy);cursor:pointer}.primary{width:100%;margin-top:14px;background:var(--teal);border-color:var(--teal);color:#fff;font-weight:700}.primary:disabled{opacity:.5;cursor:wait}.progress{height:6px;background:#dce7eb;border-radius:20px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;width:0;background:var(--teal);transition:width .15s}.status{font-size:11px;line-height:1.8;color:#54707e;margin-top:9px;min-height:20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.stat{background:#f0f5f7;border-radius:9px;padding:12px}.stat b{display:block;font:bold 23px Arial;direction:ltr;text-align:right}.stat span{font-size:10px;color:#5f7885}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px;border:1px solid var(--border);border-bottom:0;border-radius:9px 9px 0 0;background:#fafcfd}.tools label{font-size:10px;color:#587380}.canvas{position:relative;background:#dfe8ed;border:1px solid var(--border);padding:14px;min-height:460px;overflow:auto;direction:ltr}.canvas svg{display:block;width:100%;height:auto;min-width:520px;background:#fff;box-shadow:0 3px 12px #20394b20;touch-action:none}.alts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:12px}.alt{text-align:right}.alt.active{border:2px solid var(--teal);padding:8px;background:#ecf7f7}.verification{color:#11714f;font-size:11px;line-height:1.7;margin-top:10px}.note{border-right:3px solid var(--gold);background:#fbf9f1;padding:10px 12px;font-size:10px;line-height:1.8;margin-top:14px}@media(max-width:800px){.wrap{grid-template-columns:1fr;padding:8px}.stats{grid-template-columns:1fr 1fr}.alts{grid-template-columns:1fr 1fr}.canvas{min-height:300px}.canvas svg{min-width:0}}
</style></head><body>
<div class="wrap"><aside class="side"><h2>مونتاج الفرخ</h2><div id="templateInfo" class="small">في انتظار القالب…</div><h3>الفرخ ومساحة التشغيل</h3><div class="fields">
<label class="field"><span>عرض الفرخ · مم</span><input id="sw" type="number" value="1000"></label><label class="field"><span>ارتفاع الفرخ · مم</span><input id="sh" type="number" value="690"></label>
<label class="field"><span>البنسة العلوية · مم</span><input id="grip" type="number" value="10"></label><label class="field"><span>الهامش العلوي · مم</span><input id="mt" type="number" value="5"></label>
<label class="field"><span>الهامش الأيسر · مم</span><input id="ml" type="number" value="5"></label><label class="field"><span>الهامش الأيمن · مم</span><input id="mr" type="number" value="5"></label>
<label class="field"><span>الهامش السفلي · مم</span><input id="mb" type="number" value="5"></label><label class="field"><span>فاصل القص · مم</span><input id="gap" type="number" value="3" step=".1"></label>
<label class="field full"><span>Bleed لكل قطعة · مم</span><input id="bleed" type="number" value="0" step=".1"></label>
<label class="field full"><span>الدوران</span><select id="angles"><option value="half">0° / 180° — اتجاه فلوت ثابت</option><option value="all">0° / 90° / 180° / 270°</option><option value="none">0° فقط</option></select></label>
<label class="field full"><span>مستوى البحث</span><select id="depth"><option value="fast">متوازن</option><option value="deep">موسع</option></select></label></div>
<button id="run" class="primary">بحث عن أفضل مونتاج</button><div class="progress"><i id="bar"></i></div><div id="status" class="status">جاهز</div><div class="note">المحرك يستخدم NFP حقيقيًا وClipper لدمج مناطق منع التصادم، ثم يعيد فحص كل توزيع بفاصل أمان مستقل.</div></aside>
<main class="panel"><div class="stats"><div class="stat"><b id="count">—</b><span>قطعة / فرخ</span></div><div class="stat"><b id="use">—</b><span>استغلال القالب</span></div><div class="stat"><b id="blank">—</b><span>المقاس المستخدم</span></div><div class="stat"><b id="minGap">—</b><span>أقل فاصل</span></div></div>
<div class="tools"><button id="zoomIn">+</button><button id="zoomOut">−</button><label><input type="checkbox" id="creases" checked> التكسير</label><label><input type="checkbox" id="labels" checked> الترقيم</label><label><input type="checkbox" id="artwork"> التصميم الخارجي</label><span id="engineBadge" class="small">Mahaba NestEngine · Clipper NFP</span></div>
<div class="canvas"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div><div id="verification" class="verification"></div><h3>أفضل البدائل</h3><div id="alts" class="alts"></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/clipper-lib@6.4.2/clipper.js"></script>
<script src="../../studio-src/nest-engine-core.js"></script>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),engine=globalThis.MahabaNestEngine;let state={template:null,layout:[],result:null,index:0,zoom:1,art:null};
const area=p=>Math.abs(p.reduce((s,a,i)=>{const b=p[(i+1)%p.length];return s+a[0]*b[1]-a[1]*b[0]},0)/2);
function summarize(out=state.result,index=state.index){const c=config(),r=out?.results?.[index],pieces=r?.layout?.length||state.layout.length||0,blank=state.template?.polygon?area(state.template.polygon):0,util=c.sheetW*c.sheetH>0?pieces*blank/(c.sheetW*c.sheetH):0;return {pieces_per_sheet:pieces,waste_percent:Math.max(0,100-util*100),utilization:util,sheet_width_mm:c.sheetW,sheet_height_mm:c.sheetH,effective_width_mm:c.W,effective_height_mm:c.H,rotations_deg:[...c.angles],spacing_mm:+$('gap').value,gripper_mm:+$('grip').value,used_width_mm:r?.w??null,used_height_mm:r?.h??null,layout:state.layout.map(x=>({...x})),option_name:r?.name||null};}
function publish(){const summary=summarize();parent?.postMessage({type:'mahabat:nesting-result',payload:{summary,layout:state.layout,settings:{sw:+$('sw').value,sh:+$('sh').value,grip:+$('grip').value,gap:+$('gap').value,angles:$('angles').value,depth:$('depth').value}}},'*');}
function config(){const sheetW=+$('sw').value,sheetH=+$('sh').value,top=Math.max(+$('grip').value,+$('mt').value),left=+$('ml').value,right=+$('mr').value,bottom=+$('mb').value,bleed=Math.max(0,+$('bleed').value),gap=Math.max(0,+$('gap').value),angles=$('angles').value==='all'?[0,90,180,270]:$('angles').value==='none'?[0]:[0,180];return {sheetW,sheetH,offsetX:left,offsetY:top,W:sheetW-left-right,H:sheetH-top-bottom,clearance:gap+2*bleed,angles,deep:$('depth').value==='deep'};}
function validateConfig(c){if(!(c.sheetW>0&&c.sheetH>0&&c.W>0&&c.H>0))throw Error('مقاس الفرخ أو الهوامش غير صالح.');if(c.clearance<0)throw Error('الفاصل غير صالح.');}
function render(layout=state.layout){const T=state.template,c=config(),svg=$('svg');svg.replaceChildren();validateConfig(c);svg.setAttribute('viewBox',`0 0 ${c.sheetW} ${c.sheetH}`);svg.style.width=(state.zoom*100)+'%';const ns='http://www.w3.org/2000/svg',node=(tag,attrs,parent=svg)=>{const n=document.createElementNS(ns,tag);for(const[k,v]of Object.entries(attrs))n.setAttribute(k,v);parent.append(n);return n};node('rect',{x:0,y:0,width:c.sheetW,height:c.sheetH,fill:'#fff',stroke:'#8ba0ad','stroke-width':1});node('rect',{x:0,y:0,width:c.sheetW,height:c.offsetY,fill:'#f8efe1'});node('rect',{x:c.offsetX,y:c.offsetY,width:c.W,height:c.H,fill:'none',stroke:'#1d8890','stroke-dasharray':'7 4'});if(!T)return;const vs=engine.makeVariants(T);for(const[idx,a]of layout.entries()){const v=vs[a.r/90],g=node('g',{transform:`translate(${a.x+c.offsetX} ${a.y+c.offsetY})`});node('polygon',{points:v.p.map(q=>q.join(',')).join(' '),fill:state.art&&$('artwork').checked?'#ffffff':'#dcebed',stroke:'#173548','stroke-width':.8},g);if(state.art&&$('artwork').checked){const defs=svg.querySelector('defs')||node('defs',{}),id='clip-'+idx,clip=node('clipPath',{id},defs);node('polygon',{points:v.p.map(q=>q.join(',')).join(' ')},clip);const im=node('image',{href:state.art,x:0,y:0,width:v.w,height:v.h,'clip-path':`url(#${id})`,preserveAspectRatio:'xMidYMid slice'},g);im.setAttribute('opacity','.82');}if($('creases').checked)for(const line of v.creases)node('polyline',{points:line.map(q=>q.join(',')).join(' '),fill:'none',stroke:'#13a454','stroke-width':.35},g);if($('labels').checked){const t=node('text',{x:v.w/2,y:v.h/2,'text-anchor':'middle','font-size':12,fill:'#365868'},g);t.textContent=idx+1;}}
}
function show(out,index=0){state.result=out;state.index=index;const r=out.results?.[index];if(!r){state.layout=[];render();$('status').textContent='لا يوجد مونتاج صالح بهذه الإعدادات.';publish();return;}state.layout=r.layout.map(x=>({...x}));render();const c=config(),check=engine.validate(state.layout,out.variants,{W:c.W,H:c.H,clearance:c.clearance,angles:c.angles},true),util=state.layout.length*area(state.template.polygon)/(c.sheetW*c.sheetH)*100;$('count').textContent=state.layout.length;$('use').textContent=Math.min(100,util).toFixed(1)+'%';$('blank').textContent=r.w.toFixed(0)+'×'+r.h.toFixed(0);$('minGap').textContent=Number.isFinite(check.min)?check.min.toFixed(2)+' mm':'—';$('verification').textContent=check.ok?'✓ تم التحقق هندسيًا: لا يوجد تداخل، وكل القطع داخل مساحة التشغيل.':'⚠ '+check.reason;$('status').textContent=r.name;$('alts').replaceChildren();out.results.slice(0,6).forEach((a,i)=>{const b=document.createElement('button');b.className='alt'+(i===index?' active':'');b.innerHTML=`<b>${a.layout.length} قطعة</b><br><span class="small">${a.name}</span><br><small>${a.w.toFixed(0)} × ${a.h.toFixed(0)} مم</small>`;b.onclick=()=>show(out,i);$('alts').append(b);});publish();}
async function run(){if(!state.template)return;const c=config();validateConfig(c);if(!engine||typeof ClipperLib==='undefined'){throw Error('محرك Clipper/NFP لم يتم تحميله.');}$('run').disabled=true;$('bar').style.width='5%';$('status').textContent='جارٍ تجهيز NFP ودمج مناطق التصادم…';await new Promise(r=>requestAnimationFrame(r));try{const out=engine.solve(state.template,null,{W:c.W,H:c.H,clearance:c.clearance,angles:c.angles,deep:c.deep},p=>{const total=Math.max(1,p.total||1),done=Math.min(total,p.done||0);$('bar').style.width=(8+90*done/total)+'%';$('status').textContent=p.stage||`تحسين المونتاج · أفضل نتيجة ${p.best||0} قطعة`;});$('bar').style.width='100%';show(out,0);}catch(e){$('bar').style.width='0';$('status').textContent=e.message;console.error(e);}finally{$('run').disabled=false;}}
window.importNesting=data=>{state.template=data.template;state.art=data.template?.art||null;if(data.settings){for(const[k,id]of Object.entries({sw:'sw',sh:'sh',grip:'grip',gap:'gap',angles:'angles',depth:'depth'}))if(data.settings[k]!=null&&$(id))$(id).value=data.settings[k];}state.layout=data.layout?.map(x=>({...x}))||[];$('templateInfo').innerHTML=`<b>${state.template.code||'Template'}</b><br>${state.template.width.toFixed(1)} × ${state.template.height.toFixed(1)} مم<br>${state.template.polygon.length} نقطة بالمحيط`;render();setTimeout(run,20);};
window.exportNesting=()=>({layout:state.layout,summary:summarize(),settings:{sw:+$('sw').value,sh:+$('sh').value,grip:+$('grip').value,gap:+$('gap').value,angles:$('angles').value,depth:$('depth').value}});
$('run').onclick=()=>run().catch(e=>$('status').textContent=e.message);for(const id of['sw','sh','grip','mt','ml','mr','mb','gap','bleed','angles','depth'])$(id).onchange=()=>render();for(const id of['creases','labels','artwork'])$(id).onchange=()=>render();$('zoomIn').onclick=()=>{state.zoom=Math.min(3,state.zoom+.15);render()};$('zoomOut').onclick=()=>{state.zoom=Math.max(.45,state.zoom-.15);render()};
})();
</script></body></html>
