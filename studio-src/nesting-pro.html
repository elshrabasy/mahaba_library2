<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mahabat Nesting Pro</title><style>
:root{--bg:#08141e;--panel:#102630;--panel2:#132f3a;--line:#294650;--text:#eaf4f5;--muted:#7f9aa5;--teal:#2cc8bb;--gold:#c8a85c;--cut:#f0706a;--crease:#39c985;--sheet:#0b1b23}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:12px Tahoma,Arial,sans-serif}body{overflow:hidden}.app{display:grid;grid-template-columns:340px minmax(0,1fr);height:100vh}.side{padding:14px;overflow:auto;background:linear-gradient(180deg,#112934,#0d2029);border-inline-end:1px solid var(--line)}.brand{font-size:9px;color:#6f8f9a}.side h2{margin:4px 0;font-size:20px}.sub,.muted{color:var(--muted);font-size:9px;line-height:1.55}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:12px 0}.tabs button{padding:8px 4px}.tabs button.active{border-color:var(--teal);background:#163c3a;color:#75e8dd}.section{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}.section h3{font-size:10px;margin:0 0 8px;color:#91abb4}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.field{display:grid;gap:4px}.field span{font-size:8px;color:#78939d}.field input,.field select{width:100%;padding:8px;border:1px solid #31515d;border-radius:8px;background:#0c1f28;color:var(--text)}.full{grid-column:1/-1}button{border:1px solid #31515d;background:#122b35;color:#dcebed;padding:9px 10px;border-radius:8px;cursor:pointer;font:inherit}.primary{width:100%;margin-top:10px;background:linear-gradient(135deg,#23b9ad,#169a92);color:#06211f;border-color:#35d3c6;font-weight:700}.primary:disabled{opacity:.55}.progress{height:5px;background:#18313a;border-radius:20px;overflow:hidden;margin-top:9px}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),#70e7db)}.status{font-size:9px;color:#8da6af;line-height:1.6;margin-top:8px}.alts{display:grid;gap:6px;margin-top:10px}.alt{text-align:start}.alt.active{border-color:var(--teal);background:#163c3a}.alt .meta{display:flex;justify-content:space-between;gap:6px;margin-top:4px;color:var(--muted);font-size:8px}.stage{height:72px;padding:9px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;background:#0c2029}.stats{display:flex;gap:6px;flex-wrap:wrap}.stat{background:#112b35;border:1px solid var(--line);border-radius:9px;padding:7px 9px;min-width:82px}.stat b{display:block;font-size:15px}.stat span{font-size:8px;color:var(--muted)}.prefs{display:flex;gap:5px}.prefs button{padding:6px 8px;font-size:9px}.canvasWrap{height:calc(100vh - 72px);padding:10px;overflow:auto}.canvas{background:var(--sheet);border:1px solid var(--line);border-radius:12px;min-height:100%;padding:10px}svg{display:block;width:100%;height:auto;min-height:520px}.hint{padding:7px 8px;border:1px solid #685a2e;background:#2b2617;border-radius:8px;color:#d7bd73;font-size:9px;margin-top:7px}.legend{display:flex;gap:10px;font-size:8px;color:var(--muted);margin-top:8px}.legend i{display:inline-block;width:16px;height:2px;margin-inline-end:4px}.cut{background:var(--cut)}.crease{background:var(--crease)}
html[data-theme="light"]{--bg:#edf3f5;--panel:#fff;--panel2:#f7fbfc;--line:#c8d7dc;--text:#17313b;--muted:#6e8791;--sheet:#fff}html[data-theme="light"] .side,html[data-theme="light"] .stage,html[data-theme="light"] .stat{background:#fff}html[data-theme="light"] .field input,html[data-theme="light"] .field select,html[data-theme="light"] button{background:#fff;color:#17313b;border-color:#c5d5da}html[data-theme="light"] .tabs button.active,html[data-theme="light"] .alt.active{background:#e0f7f4;color:#0b6f69}html[data-theme="light"] .hint{background:#fff7df;color:#7b641f}
@media(max-width:760px){body{overflow:auto}.app{display:block;height:auto}.side{border-inline-end:0;border-bottom:1px solid var(--line)}.stage{position:sticky;top:0;z-index:5;height:auto}.canvasWrap{height:auto;min-height:45vh}.canvas{min-height:44vh}svg{min-height:320px}.primary{position:sticky;bottom:8px;z-index:4}}
</style></head><body><div class="app"><aside class="side"><div class="brand">MAHABAT · LAYOUT OPTIMIZER</div><h2 data-i18n="title">مونتاج الإنتاج</h2><div class="sub" data-i18n="sub">قوالب تعشيق + NFP + تحسين الفرخ + تحسين الكمية.</div><div id="templateInfo" class="status">في انتظار القالب…</div>
<div class="tabs"><button class="active" data-mode="auto" data-i18n="auto">تلقائي</button><button data-mode="templates" data-i18n="templates">قوالب</button><button data-mode="production" data-i18n="production">تشغيل إنتاج</button></div>
<div class="section"><h3 data-i18n="sheet">الفرخ</h3><div class="grid"><label class="field full"><span data-i18n="preset">مقاس جاهز</span><select id="preset"><option value="custom">مخصص</option><option value="1000x690">1000 × 690</option><option value="900x640">900 × 640</option><option value="700x500">700 × 500</option><option value="330x495">330 × 495</option></select></label><label class="field"><span data-i18n="width">العرض مم</span><input id="sw" type="number" value="1000"></label><label class="field"><span data-i18n="height">الارتفاع مم</span><input id="sh" type="number" value="690"></label><label class="field"><span data-i18n="gripper">البنسة</span><input id="grip" type="number" value="10"></label><label class="field"><span data-i18n="gap">الفاصل</span><input id="gap" type="number" value="3"></label><label class="field full"><span data-i18n="rotation">الدوران</span><select id="rot"><option value="half">0° / 180°</option><option value="all">0° / 90° / 180° / 270°</option><option value="none">0°</option></select></label></div></div>
<div class="section"><h3 data-i18n="run">تشغيل الإنتاج</h3><div class="grid"><label class="field"><span data-i18n="qty">الكمية</span><input id="qty" type="number" value="1000"></label><label class="field"><span data-i18n="allow">هالك تجهيز %</span><input id="allow" type="number" value="2" step=".1"></label><label class="field full"><span data-i18n="over">زيادة مسموحة للعميل %</span><input id="over" type="number" value="0" step=".1"></label></div></div>
<button id="runBtn" class="primary" data-i18n="find">احسب أفضل البدائل</button><div class="progress"><i id="bar"></i></div><div id="status" class="status">جاهز</div><div id="hints"></div><div class="legend"><span><i class="cut"></i><span data-i18n="cut">قص</span></span><span><i class="crease"></i><span data-i18n="crease">تكسير</span></span></div><div id="alts" class="alts"></div></aside>
<main><div class="stage"><div class="stats"><div class="stat"><b id="count">—</b><span data-i18n="pps">قطعة/فرخ</span></div><div class="stat"><b id="sheets">—</b><span data-i18n="sheets">عدد الأفرخ</span></div><div class="stat"><b id="waste">—</b><span data-i18n="waste">هالك</span></div><div class="stat"><b id="excess">—</b><span data-i18n="excess">زيادة</span></div></div><div class="prefs"><button id="lang">EN</button><button id="theme">☀</button></div></div><div class="canvasWrap"><div class="canvas"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div></div></main></div>
<script src="./nest-engine-core.js"></script><script type="module">
import {prepareIrregularTemplate} from './nfp-lite.js';
const $=id=>document.getElementById(id),engine=globalThis.MahabaNestEngine;let state={template:null,layout:[],result:null,index:0,worker:null};
const dict={ar:{title:'مونتاج الإنتاج',sub:'قوالب تعشيق + NFP + تحسين الفرخ + تحسين الكمية.',auto:'تلقائي',templates:'قوالب',production:'تشغيل إنتاج',sheet:'الفرخ',preset:'مقاس جاهز',width:'العرض مم',height:'الارتفاع مم',gripper:'البنسة',gap:'الفاصل',rotation:'الدوران',run:'تشغيل الإنتاج',qty:'الكمية',allow:'هالك تجهيز %',over:'زيادة مسموحة للعميل %',find:'احسب أفضل البدائل',cut:'قص',crease:'تكسير',pps:'قطعة/فرخ',sheets:'عدد الأفرخ',waste:'هالك',excess:'زيادة'},en:{title:'Production Layout',sub:'Layout templates + NFP + sheet optimization + production-run optimization.',auto:'Auto',templates:'Templates',production:'Production Run',sheet:'Sheet',preset:'Sheet preset',width:'Width mm',height:'Height mm',gripper:'Gripper',gap:'Gap',rotation:'Rotation',run:'Production run',qty:'Quantity',allow:'Setup allowance %',over:'Allowed overproduction %',find:'Calculate best alternatives',cut:'Cut',crease:'Crease',pps:'pcs/sheet',sheets:'Sheets',waste:'Waste',excess:'Excess'}};
function prefs(){return {lang:localStorage.getItem('mahaba:lang')||'ar',theme:localStorage.getItem('mahaba:theme')||'dark'}}function applyPrefs(p=prefs()){localStorage.setItem('mahaba:lang',p.lang);localStorage.setItem('mahaba:theme',p.theme);document.documentElement.lang=p.lang;document.documentElement.dir=p.lang==='ar'?'rtl':'ltr';document.documentElement.dataset.theme=p.theme;for(const el of document.querySelectorAll('[data-i18n]'))el.textContent=dict[p.lang]?.[el.dataset.i18n]||el.textContent;$('lang').textContent=p.lang==='ar'?'EN':'ع';$('theme').textContent=p.theme==='dark'?'☀':'◐';render(state.layout)}$('lang').onclick=()=>{const p=prefs();p.lang=p.lang==='ar'?'en':'ar';applyPrefs(p)};$('theme').onclick=()=>{const p=prefs();p.theme=p.theme==='dark'?'light':'dark';applyPrefs(p)};window.addEventListener('message',e=>{if(e.data?.type==='mahaba:preferences')applyPrefs(e.data)});applyPrefs();parent?.postMessage({type:'mahaba:nesting-ready'},'*');
for(const b of document.querySelectorAll('[data-mode]'))b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b))};
$('preset').onchange=()=>{const v=$('preset').value;if(v!=='custom'){const [w,h]=v.split('x').map(Number);$('sw').value=w;$('sh').value=h;render(state.layout)}};
function config(){const sheetW=+$('sw').value,sheetH=+$('sh').value,grip=+$('grip').value,gap=+$('gap').value,offsetX=5,offsetY=Math.max(grip,5),angles=$('rot').value==='all'?[0,90,180,270]:$('rot').value==='none'?[0]:[0,180];return {W:sheetW-offsetX-5,H:sheetH-offsetY-5,clearance:gap,angles,deep:true,sheetW,sheetH,offsetX,offsetY,gripper:grip,marginRight:5,marginBottom:5}}
function runSpec(){return {quantity:+$('qty').value||0,allowance_pct:+$('allow').value||0,overproduction_pct:+$('over').value||0}}
function polygonArea(p){return Math.abs(p.reduce((s,a,i)=>{const b=p[(i+1)%p.length];return s+a[0]*b[1]-a[1]*b[0]},0)/2)}
function addPolyline(g,points,stroke,width=.55){if(!points?.length)return;const ns='http://www.w3.org/2000/svg',l=document.createElementNS(ns,'polyline');l.setAttribute('points',points.map(q=>q.join(',')).join(' '));l.setAttribute('fill','none');l.setAttribute('stroke',stroke);l.setAttribute('stroke-width',String(width));l.setAttribute('vector-effect','non-scaling-stroke');g.append(l)}
function render(layout=[]){const T=state.template,c=config(),svg=$('svg');svg.replaceChildren();svg.setAttribute('viewBox',`0 0 ${c.sheetW} ${c.sheetH}`);const ns='http://www.w3.org/2000/svg',light=document.documentElement.dataset.theme==='light';const rect=(x,y,w,h,a={})=>{const r=document.createElementNS(ns,'rect');for(const [k,v] of Object.entries({x,y,width:w,height:h,...a}))r.setAttribute(k,v);svg.append(r)};rect(0,0,c.sheetW,c.sheetH,{fill:light?'#fff':'#0b1b23',stroke:light?'#8ba0ad':'#48616b'});rect(0,0,c.sheetW,c.offsetY,{fill:light?'#f8efe1':'#2b2921'});rect(c.offsetX,c.offsetY,c.W,c.H,{fill:'none',stroke:'#2cc8bb','stroke-dasharray':'7 4'});if(!T)return;const vs=engine.makeVariants(T),cut=getComputedStyle(document.documentElement).getPropertyValue('--cut').trim(),crease=getComputedStyle(document.documentElement).getPropertyValue('--crease').trim();for(const [idx,a] of layout.entries()){const v=vs[a.r/90],g=document.createElementNS(ns,'g');g.setAttribute('transform',`translate(${a.x+c.offsetX} ${a.y+c.offsetY})`);const p=document.createElementNS(ns,'polygon');p.setAttribute('points',v.p.map(q=>q.join(',')).join(' '));p.setAttribute('fill',light?'#dcebed':'#14333d');p.setAttribute('fill-opacity','.42');p.setAttribute('stroke',light?'#80959d':'#88a3ad');p.setAttribute('stroke-width','.35');g.append(p);for(const line of v.cuts||[])addPolyline(g,line,cut,.7);for(const line of v.creases||[])addPolyline(g,line,crease,.52);const t=document.createElementNS(ns,'text');t.textContent=idx+1;t.setAttribute('x',v.w/2);t.setAttribute('y',v.h/2);t.setAttribute('text-anchor','middle');t.setAttribute('font-size','12');t.setAttribute('fill',light?'#355b6d':'#8db2bd');g.append(t);svg.append(g)}}
function show(out,index=0){state.result=out;state.index=index;const r=out?.results?.[index];if(!r)return;state.layout=(r.layout||[]).map(x=>({...x}));render(state.layout);const p=r.production||{};$('count').textContent=state.layout.length;$('sheets').textContent=Number.isFinite(p.sheets)?p.sheets:'—';$('waste').textContent=Number.isFinite(p.waste_percent)?p.waste_percent.toFixed(1)+'%':'—';$('excess').textContent=Number.isFinite(p.excess)?p.excess:'—';$('status').textContent=r.name||'Layout';$('hints').innerHTML=(out.productionHints||[]).map(h=>`<div class="hint">${h.type}: ${h.reason||''}${h.delta?` (${h.delta>0?'+':''}${h.delta})`:''}</div>`).join('');$('alts').innerHTML='';(out.results||[]).forEach((a,i)=>{const b=document.createElement('button');b.className='alt'+(i===index?' active':'');const pp=a.production||{};b.innerHTML=`<b>${a.layout?.length||0} ${document.documentElement.lang==='en'?'pcs':'قطعة'} · ${a.name}</b><div class="meta"><span>${Number.isFinite(pp.sheets)?pp.sheets+' sheets':''}</span><span>${Number.isFinite(pp.waste_percent)?pp.waste_percent.toFixed(1)+'% waste':''}</span><span>${Number.isFinite(pp.excess)?pp.excess+' excess':''}</span></div>`;b.onclick=()=>show(out,i);$('alts').append(b)});publish()}
function publish(){const c=config(),r=state.result?.results?.[state.index],p=r?.production||{},area=state.template?.polygon?polygonArea(state.template.polygon):0;parent?.postMessage({type:'mahabat:nesting-result',payload:{summary:{pieces_per_sheet:state.layout.length,waste_percent:Number.isFinite(p.waste_percent)?p.waste_percent:Math.max(0,100-state.layout.length*area/(c.sheetW*c.sheetH)*100),utilization:Number.isFinite(p.utilization)?p.utilization:0,sheet_width_mm:c.sheetW,sheet_height_mm:c.sheetH,effective_width_mm:c.W,effective_height_mm:c.H,rotations_deg:[...c.angles],spacing_mm:c.clearance,gripper_mm:+$('grip').value,layout:state.layout,option_name:r?.name||null,production:p},layout:state.layout,settings:{sw:c.sheetW,sh:c.sheetH,grip:+$('grip').value,gap:+$('gap').value,rot:$('rot').value,quantity:+$('qty').value,allowance:+$('allow').value,overproduction:+$('over').value}}},'*')}
function stop(){if(state.worker){state.worker.terminate();state.worker=null}}async function run(){if(!state.template)return;stop();$('runBtn').disabled=true;$('bar').style.width='8%';const T=prepareIrregularTemplate(state.template),c=config(),availableSheets=[{name:'1000×690',width_mm:1000,height_mm:690},{name:'900×640',width_mm:900,height_mm:640},{name:'700×500',width_mm:700,height_mm:500},{name:'330×495',width_mm:330,height_mm:495}];const worker=new Worker('./nest-worker-module.js',{type:'module'});state.worker=worker;worker.onmessage=e=>{const m=e.data||{};if(m.type==='preview'&&m.result?.results?.length&&!state.result){show(m.result,0);$('bar').style.width='18%'}else if(m.type==='progress'){$('bar').style.width=(m.phase==='nfp'?45:78)+'%';$('status').textContent=m.stage||m.phase||'…'}else if(m.type==='result'){show(m.result,0);$('bar').style.width='100%';$('runBtn').disabled=false;stop()}else if(m.type==='error'){$('status').textContent=m.message;$('runBtn').disabled=false;stop()}};worker.onerror=e=>{$('status').textContent=e.message||'Worker error';$('runBtn').disabled=false;stop()};worker.postMessage({template:T,config:c,run:runSpec(),availableSheets})}
$('runBtn').onclick=run;for(const id of ['sw','sh','grip','gap','rot','qty','allow','over'])$(id).onchange=()=>render(state.layout);window.importNesting=data=>{state.template=data.template;$('templateInfo').innerHTML=`<b>${state.template.code||'Template'}</b><br>${state.template.width.toFixed(1)} × ${state.template.height.toFixed(1)} mm`;state.layout=data.layout||[];render(state.layout);setTimeout(run,0)};window.exportNesting=()=>({layout:state.layout,settings:{sw:+$('sw').value,sh:+$('sh').value,grip:+$('grip').value,gap:+$('gap').value,rot:$('rot').value,quantity:+$('qty').value,allowance:+$('allow').value,overproduction:+$('over').value}});window.addEventListener('beforeunload',stop);
</script></body></html>
