<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mahabat Nesting</title><style>
:root{--bg:#08141e;--panel:#102630;--line:#294650;--text:#eaf4f5;--muted:#7f9aa5;--teal:#2cc8bb;--gold:#c8a85c}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:13px Tahoma,Arial,sans-serif}body{overflow:hidden}.app{display:grid;grid-template-columns:300px minmax(0,1fr);height:100vh;background:radial-gradient(circle at 70% 0,#102b35 0,transparent 42%),var(--bg)}.side{background:linear-gradient(180deg,#112934,#0d2029);border-left:1px solid var(--line);padding:16px;overflow:auto}.brand{font-size:9px;color:#6f8f9a;letter-spacing:.08em}.side h2{margin:4px 0;font-size:20px}.sub,.status{color:var(--muted);font-size:10px;line-height:1.7}.side h3{font-size:10px;margin:18px 0 8px;color:#8aa5ae}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{display:grid;gap:5px}.field span{font-size:9px;color:#79949f}.field input,.field select{width:100%;padding:9px 10px;border:1px solid #31515d;border-radius:9px;background:#0c1f28;color:var(--text);outline:none}.full{grid-column:1/-1}button{border:1px solid #31515d;background:#122b35;color:#dcebed;padding:10px 12px;border-radius:9px;cursor:pointer;font:inherit}.primary{background:linear-gradient(135deg,#23b9ad,#169a92);color:#06211f;border-color:#35d3c6;font-weight:700;width:100%;margin-top:12px}.primary:disabled{opacity:.55}.progress{height:6px;background:#18313a;border-radius:20px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),#70e7db);transition:width .18s}.stage{padding:10px 14px;background:#0c2029;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{background:#112b35;border:1px solid var(--line);border-radius:10px;padding:8px 11px;min-width:92px}.stat b{display:block;font-size:18px}.stat span{font-size:9px;color:#7f9ca6}.canvasWrap{height:calc(100vh - 70px);padding:12px;overflow:auto}.canvas{background:#0b1b23;border:1px solid var(--line);border-radius:14px;min-height:100%;overflow:auto;padding:12px}svg{display:block;width:100%;height:auto;min-height:520px}.alts{display:grid;gap:7px;margin-top:12px}.alt{text-align:right}.alt.active{border-color:var(--teal);background:#163c3a;color:#75e8dd}.muted{color:#708b95;font-size:9px}.engine-note{font-size:8px;color:#5f7e89}.error{color:#f29a91}@media(max-width:760px){body{overflow:auto}.app{display:block;height:auto;min-height:100vh}.side{border-left:0;border-bottom:1px solid var(--line);padding:14px}.side h2{font-size:18px}.stage{position:sticky;top:0;z-index:5;padding:8px 10px}.stat{min-width:78px;padding:7px 8px}.stat b{font-size:15px}.canvasWrap{height:auto;min-height:46vh;padding:8px}.canvas{min-height:44vh;border-radius:11px}svg{min-height:320px}.primary{position:sticky;bottom:8px;z-index:3;box-shadow:0 8px 28px #0008}}
</style></head><body><div class="app"><aside class="side"><div class="brand">MAHABAT · PRODUCTION</div><h2>مونتاج الفرخ</h2><div class="sub">تعشيق حقيقي على حدود القص مع فحص التداخل والفواصل.</div><div id="templateInfo" class="status">في انتظار القالب…</div><h3>إعدادات الفرخ</h3><div class="grid"><label class="field"><span>العرض مم</span><input id="sw" type="number" value="1000"></label><label class="field"><span>الارتفاع مم</span><input id="sh" type="number" value="690"></label><label class="field"><span>البنسة</span><input id="grip" type="number" value="10"></label><label class="field"><span>الفاصل</span><input id="gap" type="number" value="3"></label><label class="field full"><span>الدوران</span><select id="rot"><option value="half">0° / 180°</option><option value="all">0° / 90° / 180° / 270°</option><option value="none">0° فقط</option></select></label><label class="field full"><span>مستوى البحث</span><select id="depth"><option value="fast">متوازن</option><option value="deep">موسع</option></select></label></div><button id="run" class="primary">تحميل أفضل التعشيقات</button><div class="progress"><i id="bar"></i></div><div id="status" class="status">جاهز</div><div id="alts" class="alts"></div></aside><main><div class="stage"><div class="stats"><div class="stat"><b id="count">—</b><span>قطعة/فرخ</span></div><div class="stat"><b id="util">—</b><span>استغلال هندسي</span></div><div class="stat"><b id="minGap">—</b><span>أقل فاصل</span></div></div><div class="engine-note">NFP · Mahabat Engine</div></div><div class="canvasWrap"><div class="canvas"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div></div></main></div><script src="./nest-engine-core.js"></script><script type="module">
let state={template:null,layout:[],result:null,index:0,worker:null,token:0};const $=id=>document.getElementById(id),engine=globalThis.MahabaNestEngine;
function cfg(){const sheetW=+$('sw').value,sheetH=+$('sh').value,grip=+$('grip').value,gap=+$('gap').value,angles=$('rot').value==='all'?[0,90,180,270]:$('rot').value==='none'?[0]:[0,180],offsetX=5,offsetY=Math.max(grip,5);return {W:sheetW-offsetX-5,H:sheetH-offsetY-5,clearance:gap,angles,deep:$('depth').value==='deep',sheetW,sheetH,offsetX,offsetY};}
const area=p=>Math.abs((p||[]).reduce((s,a,i)=>{const b=p[(i+1)%p.length];return s+a[0]*b[1]-a[1]*b[0]},0)/2);
function summary(){const c=cfg(),r=state.result?.results?.[state.index],pieces=r?.layout?.length||state.layout.length||0,blank=area(state.template?.polygon),util=c.sheetW*c.sheetH?pieces*blank/(c.sheetW*c.sheetH):0;return {pieces_per_sheet:pieces,waste_percent:Math.max(0,100-util*100),utilization:util,sheet_width_mm:c.sheetW,sheet_height_mm:c.sheetH,effective_width_mm:c.W,effective_height_mm:c.H,rotations_deg:[...c.angles],spacing_mm:c.clearance,gripper_mm:+$('grip').value,used_width_mm:r?.w??null,used_height_mm:r?.h??null,layout:state.layout.map(x=>({...x})),option_name:r?.name||null};}
function publish(){parent?.postMessage({type:'mahabat:nesting-result',payload:{summary:summary(),layout:state.layout,settings:{sw:+$('sw').value,sh:+$('sh').value,grip:+$('grip').value,gap:+$('gap').value,rot:$('rot').value,depth:$('depth').value}}},'*');}
function render(layout=[]){const T=state.template,c=cfg(),svg=$('svg');svg.replaceChildren();svg.setAttribute('viewBox',`0 0 ${c.sheetW} ${c.sheetH}`);const ns='http://www.w3.org/2000/svg',rect=(x,y,w,h,attrs={})=>{const r=document.createElementNS(ns,'rect');for(const [k,v] of Object.entries({x,y,width:w,height:h,...attrs}))r.setAttribute(k,v);svg.append(r)};rect(0,0,c.sheetW,c.sheetH,{fill:'#10232c',stroke:'#49646f'});rect(0,0,c.sheetW,c.offsetY,{fill:'#302a1e'});rect(c.offsetX,c.offsetY,c.W,c.H,{fill:'none',stroke:'#2cc8bb','stroke-dasharray':'7 4'});if(!T||!engine)return;const vs=engine.makeVariants(T);layout.forEach((a,idx)=>{const v=vs[Math.max(0,Math.round(a.r/90))%4],g=document.createElementNS(ns,'g');g.setAttribute('transform',`translate(${a.x+c.offsetX} ${a.y+c.offsetY})`);const p=document.createElementNS(ns,'polygon');p.setAttribute('points',v.p.map(q=>q.join(',')).join(' '));p.setAttribute('fill','#173943');p.setAttribute('stroke','#d8edf0');g.append(p);for(const line of v.creases||[]){const l=document.createElementNS(ns,'polyline');l.setAttribute('points',line.map(q=>q.join(',')).join(' '));l.setAttribute('fill','none');l.setAttribute('stroke','#39c87a');l.setAttribute('stroke-width','.45');g.append(l)}const t=document.createElementNS(ns,'text');t.textContent=idx+1;t.setAttribute('x',v.w/2);t.setAttribute('y',v.h/2);t.setAttribute('text-anchor','middle');t.setAttribute('font-size','13');t.setAttribute('fill','#9ec1c8');g.append(t);svg.append(g)});}
function show(out,index=0,label='تم العثور على أفضل التعشيقات'){state.result=out;state.index=index;const r=out?.results?.[index];if(!r){$('status').textContent='لا يوجد تعشيق صالح بهذه الإعدادات.';$('status').classList.add('error');publish();return}state.layout=(r.layout||[]).map(x=>({...x}));render(state.layout);const c=cfg();$('count').textContent=state.layout.length;$('util').textContent=(state.layout.length*area(state.template.polygon)/(c.sheetW*c.sheetH)*100).toFixed(1)+'%';try{const check=engine.validate(state.layout,out.variants,{W:c.W,H:c.H,clearance:c.clearance,angles:c.angles},true);$('minGap').textContent=Number.isFinite(check.min)?check.min.toFixed(2)+' mm':'—';}catch{$('minGap').textContent='—'}$('status').classList.remove('error');$('status').textContent=label+(r.name?' · '+r.name:'');$('alts').innerHTML='';(out.results||[]).forEach((a,i)=>{const b=document.createElement('button');b.className='alt'+(i===index?' active':'');const name=a.name||('حل '+(i+1));b.innerHTML=`<b>${a.layout.length} قطعة</b><br><span class="muted">${name}</span>`;b.onclick=()=>show(out,i);$('alts').append(b)});publish();}
function stop(){if(state.worker){state.worker.terminate();state.worker=null;}}
function run(){if(!state.template||!engine)return;stop();const token=++state.token;$('run').disabled=true;$('status').classList.remove('error');$('status').textContent='جارٍ تجهيز أفضل التعشيقات…';$('bar').style.width='8%';try{const worker=new Worker('./nest-worker-module.js',{type:'module'});state.worker=worker;worker.onmessage=e=>{if(token!==state.token)return;const m=e.data||{};if(m.type==='preview'){if(m.result?.results?.length)show(m.result,0,'معاينة سريعة جاهزة');$('bar').style.width='20%';return}if(m.type==='progress'){const total=Math.max(1,m.total||1),done=Math.max(0,m.done||0),base=m.phase==='solve'?60:20,span=38;$('bar').style.width=Math.min(98,base+span*(done/total))+'%';$('status').textContent=m.phase==='solve'?`تحسين التعشيق · أفضل نتيجة ${m.best||0} قطعة`:(m.stage||'تجهيز NFP…');return}if(m.type==='result'){$('bar').style.width='100%';show(m.result,0);$('run').disabled=false;stop();return}if(m.type==='error'){throw new Error(m.message||'تعذر حساب التعشيق.');}};worker.onerror=e=>{$('status').textContent='تعذر تشغيل محرك التعشيق: '+(e.message||'خطأ غير معروف');$('status').classList.add('error');$('bar').style.width='0';$('run').disabled=false;stop();};worker.postMessage({template:state.template,config:cfg()});}catch(e){$('status').textContent=e.message;$('status').classList.add('error');$('bar').style.width='0';$('run').disabled=false;stop();}}
$('run').onclick=run;for(const id of ['sw','sh','grip','gap','rot','depth'])$(id).onchange=()=>render(state.layout);window.importNesting=data=>{stop();state.template=data.template;state.layout=data.layout||[];$('templateInfo').innerHTML=`<b>${state.template.code||'Template'}</b><br>${Number(state.template.width).toFixed(1)} × ${Number(state.template.height).toFixed(1)} mm`;render(state.layout);setTimeout(run,60)};window.exportNesting=()=>({layout:state.layout,summary:summary(),settings:{sw:+$('sw').value,sh:+$('sh').value,grip:+$('grip').value,gap:+$('gap').value,rot:$('rot').value,depth:$('depth').value}});addEventListener('beforeunload',stop);
</script></body></html>
