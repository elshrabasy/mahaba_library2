<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mahabat Nesting</title><style id="mahabatNestTheme">
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#edf3f5;color:#173548;font-family:Tahoma,Arial,sans-serif}.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 16px;background:#102f3d;color:#fff;border-bottom:2px solid #c3a45f}.title{display:flex;align-items:center;gap:12px;min-width:0}.title b{font-size:18px}.title small{display:block;color:#8eb0bc;margin-top:3px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{background:#173e4d;color:#fff;border:1px solid #44616d;border-radius:9px;padding:9px 12px;cursor:pointer}.actions button.primary{background:#18b6ae;color:#052f32;border-color:#2ac8bf;font-weight:700}.body{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;padding:14px}.sheet-card,.controls{background:#fff;border:1px solid #d8e3e8;border-radius:14px;box-shadow:0 8px 24px rgba(13,47,61,.07);min-height:0}.sheet-card{display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}.stats{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid #e0e8ec}.stat{background:#f6fafb;border:1px solid #dce6ea;border-radius:9px;padding:8px 11px;min-width:105px}.stat b{display:block;font-size:18px;color:#102f3d}.stat span{font-size:10px;color:#718794}.canvasWrap{min-height:0;overflow:auto;padding:14px}.canvas{min-height:100%;background:#fff;border:1px solid #cddae0;border-radius:12px;overflow:auto;padding:10px}.canvas svg{display:block;width:100%;height:auto;min-height:520px}.controls{padding:16px;overflow:auto}.controls h3{margin:0 0 12px;font-size:15px}.template{padding:10px 12px;border:1px solid #dbe5ea;background:#f7fafb;border-radius:9px;font-size:11px;line-height:1.7;margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{display:grid;gap:5px}.field span{font-size:10px;color:#708793}.field input,.field select{width:100%;padding:9px;border:1px solid #ccd9df;border-radius:8px;background:#fff;color:#173548}.full{grid-column:1/-1}.status{margin-top:12px;padding:10px 11px;border-radius:9px;background:#edf7f7;color:#315763;font-size:11px;line-height:1.7}.progress{height:6px;background:#dfe9ed;border-radius:20px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;width:0;background:#18b6ae;transition:width .15s}.alts{display:grid;gap:7px;margin-top:12px}.alt{text-align:right;background:#fff;border:1px solid #d5e0e5;border-radius:8px;padding:9px;cursor:pointer}.alt.active{border-color:#18b6ae;background:#eefafa}.muted{font-size:10px;color:#718794}.hint{font-size:10px;color:#718794;margin-top:12px;line-height:1.7}@media(max-width:900px){.body{grid-template-columns:1fr;overflow:auto}.app{overflow:auto;height:auto;min-height:100%}.controls{order:-1}.canvas svg{min-height:360px}}
</style></head><body><div class="app"><header class="top"><div class="title"><div><b>مونتاج الفرخ</b><small id="templateInfo">في انتظار القالب…</small></div></div><div class="actions"><button id="reset">إعادة ضبط</button><button id="run" class="primary">تشغيل التعشيق الاحترافي</button></div></header><section class="body"><div class="sheet-card"><div class="stats"><div class="stat"><b id="count">—</b><span>قطعة/فرخ</span></div><div class="stat"><b id="util">—</b><span>استغلال هندسي</span></div><div class="stat"><b id="minGap">—</b><span>أقل فاصل</span></div></div><div class="canvasWrap"><div class="canvas"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div></div></div><aside class="controls"><h3>إعدادات الفرخ</h3><div class="grid"><label class="field"><span>العرض مم</span><input id="sw" type="number" value="1000"></label><label class="field"><span>الارتفاع مم</span><input id="sh" type="number" value="690"></label><label class="field"><span>البنسة مم</span><input id="grip" type="number" value="10"></label><label class="field"><span>الفاصل مم</span><input id="gap" type="number" value="3"></label><label class="field full"><span>الدوران</span><select id="rot"><option value="half">0° / 180°</option><option value="all">0° / 90° / 180° / 270°</option><option value="none">0° فقط</option></select></label><label class="field full"><span>مستوى البحث</span><select id="depth"><option value="fast">متوازن</option><option value="deep">موسع</option></select></label></div><div class="progress"><i id="bar"></i></div><div id="status" class="status">جاهز. فتح صفحة المونتاج لا يبدأ الحساب تلقائيًا.</div><div id="alts" class="alts"></div><div class="hint">التعشيق الهندسي الثقيل يعمل في Worker منفصل حتى لا تتجمد صفحة الاستوديو.</div></aside></section></div>
<script src="./nest-engine-core.js"></script><script type="module">
let state={template:null,layout:[],result:null,index:0,worker:null};const $=id=>document.getElementById(id),engine=globalThis.MahabaNestEngine;
function config(){const W=+$('sw').value,H=+$('sh').value,grip=+$('grip').value,gap=+$('gap').value,angles=$('rot').value==='all'?[0,90,180,270]:$('rot').value==='none'?[0]:[0,180];return {W:W-10,H:H-Math.max(grip,5)-5,clearance:gap,angles,deep:$('depth').value==='deep',sheetW:W,sheetH:H,offsetX:5,offsetY:Math.max(grip,5)};}
function polygonArea(p){return Math.abs(p.reduce((s,a,i)=>{const b=p[(i+1)%p.length];return s+a[0]*b[1]-a[1]*b[0]},0)/2)}
function render(layout=[]){const T=state.template,c=config(),svg=$('svg');svg.replaceChildren();svg.setAttribute('viewBox',`0 0 ${c.sheetW} ${c.sheetH}`);const ns='http://www.w3.org/2000/svg',rect=(x,y,w,h,attrs={})=>{const r=document.createElementNS(ns,'rect');for(const [k,v] of Object.entries({x,y,width:w,height:h,...attrs}))r.setAttribute(k,v);svg.append(r)};rect(0,0,c.sheetW,c.sheetH,{fill:'#fff',stroke:'#8ba0ad'});rect(0,0,c.sheetW,c.offsetY,{fill:'#f7ead6'});rect(c.offsetX,c.offsetY,c.W,c.H,{fill:'none',stroke:'#18a4aa','stroke-dasharray':'7 4'});if(!T)return;const vs=engine.makeVariants(T);for(const [idx,a] of layout.entries()){const v=vs[a.r/90],g=document.createElementNS(ns,'g');g.setAttribute('transform',`translate(${a.x+c.offsetX} ${a.y+c.offsetY})`);const p=document.createElementNS(ns,'polygon');p.setAttribute('points',v.p.map(q=>q.join(',')).join(' '));p.setAttribute('fill','#dfeff1');p.setAttribute('stroke','#163949');p.setAttribute('stroke-width','1');g.append(p);for(const line of v.creases||[]){const l=document.createElementNS(ns,'polyline');l.setAttribute('points',line.map(q=>q.join(',')).join(' '));l.setAttribute('fill','none');l.setAttribute('stroke','#16a05b');l.setAttribute('stroke-width','.45');g.append(l)}const t=document.createElementNS(ns,'text');t.textContent=idx+1;t.setAttribute('x',v.w/2);t.setAttribute('y',v.h/2);t.setAttribute('text-anchor','middle');t.setAttribute('font-size','13');t.setAttribute('fill','#355b6d');g.append(t);svg.append(g)}}
function showResult(out,index=0){state.result=out;state.index=index;const r=out?.results?.[index];if(!r){$('status').textContent='لا يوجد تعشيق صالح بهذه الإعدادات.';return}state.layout=r.layout.map(x=>({...x}));render(state.layout);$('count').textContent=state.layout.length;const c=config(),area=polygonArea(state.template.polygon);$('util').textContent=(state.layout.length*area/(c.sheetW*c.sheetH)*100).toFixed(1)+'%';const check=engine.validate(state.layout,out.variants,{W:c.W,H:c.H,clearance:c.clearance,angles:c.angles},true);$('minGap').textContent=Number.isFinite(check.min)?check.min.toFixed(2)+' mm':'—';$('status').textContent=r.name+' · تم التحقق من عدم وجود تداخل';$('alts').innerHTML='';out.results.forEach((a,i)=>{const b=document.createElement('button');b.className='alt'+(i===index?' active':'');b.innerHTML=`<b>${a.layout.length} قطعة</b><br><span class="muted">${a.name}</span>`;b.onclick=()=>showResult(out,i);$('alts').append(b)})}
function stopWorker(){if(state.worker){state.worker.terminate();state.worker=null}}
function run(){if(!state.template)return;stopWorker();$('status').textContent='جارٍ بدء التعشيق في الخلفية…';$('bar').style.width='8%';const w=new Worker('./nest-worker-module.js',{type:'module'});state.worker=w;w.onmessage=e=>{const m=e.data||{};if(m.type==='preview'&&m.result?.results?.length){showResult(m.result,0);$('status').textContent='تمت المعاينة السريعة، وجارٍ تحسين التعشيق…';$('bar').style.width='25%'}else if(m.type==='progress'){const p=m.total?Math.min(1,(m.done+1)/m.total):0;$('bar').style.width=(m.phase==='nfp'?25+35*p:60+38*p)+'%';$('status').textContent=m.stage||`تحسين التعشيق · أفضل نتيجة ${m.best||0} قطعة`}else if(m.type==='result'){showResult(m.result,0);$('bar').style.width='100%';$('status').textContent='اكتمل التعشيق بدون تجميد واجهة الاستوديو.';stopWorker()}else if(m.type==='error'){$('status').textContent=m.message||'تعذر تشغيل المونتاج.';$('bar').style.width='0';stopWorker()}};w.onerror=e=>{$('status').textContent=e.message||'تعذر تشغيل Worker.';$('bar').style.width='0';stopWorker()};w.postMessage({template:state.template,config:config()})}
$('run').onclick=run;$('reset').onclick=()=>{stopWorker();state.layout=[];state.result=null;$('bar').style.width='0';$('count').textContent=$('util').textContent=$('minGap').textContent='—';$('alts').innerHTML='';render([]);$('status').textContent='تمت إعادة الضبط.'};for(const id of ['sw','sh','grip','gap','rot','depth'])$(id).onchange=()=>{stopWorker();render(state.layout);$('status').textContent='تم تعديل الإعدادات. اضغط تشغيل التعشيق.'};
window.importNesting=data=>{stopWorker();state.template=data.template;$('templateInfo').textContent=`${state.template.code||'Template'} · ${state.template.width.toFixed(1)} × ${state.template.height.toFixed(1)} mm`;state.layout=data.layout?.length?data.layout:[];render(state.layout);if(state.layout.length){$('count').textContent=state.layout.length;$('status').textContent='تم استعادة المونتاج المحفوظ. اضغط تشغيل لتحسينه.'}else{$('status').textContent='القالب جاهز. اضغط تشغيل التعشيق الاحترافي.';$('count').textContent=$('util').textContent=$('minGap').textContent='—'}};
window.exportNesting=()=>({layout:state.layout,settings:{sw:+$('sw').value,sh:+$('sh').value,grip:+$('grip').value,gap:+$('gap').value,rot:$('rot').value,depth:$('depth').value}});window.addEventListener('beforeunload',stopWorker);
</script></body></html>
