<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mahabat Nesting</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf2f5;color:#173548;font:13px Arial,Tahoma,sans-serif}.app{display:grid;grid-template-columns:285px 1fr;min-height:100vh}.side{background:#fff;border-left:1px solid #d6e0e6;padding:16px;overflow:auto}.side h2{margin:0 0 12px;font-size:18px}.side h3{font-size:12px;margin:18px 0 8px;color:#607887}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{display:grid;gap:4px}.field span{font-size:10px;color:#607887}.field input,.field select{width:100%;padding:8px;border:1px solid #cbd8df;border-radius:7px;background:#fff}.full{grid-column:1/-1}button{border:1px solid #cbd8df;background:#fff;padding:9px 11px;border-radius:7px;cursor:pointer}.primary{background:#087f86;color:#fff;border-color:#087f86;font-weight:bold;width:100%;margin-top:12px}.status{font-size:11px;line-height:1.7;color:#56717f;margin-top:10px}.stage{padding:12px 14px;background:#f8fafb;border-bottom:1px solid #d8e1e6;display:flex;justify-content:space-between;gap:10px}.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{background:#fff;border:1px solid #d8e1e6;border-radius:8px;padding:8px 10px}.stat b{display:block;font-size:18px}.canvasWrap{padding:14px}.canvas{background:#fff;border:1px solid #ccd8df;border-radius:10px;min-height:520px;overflow:auto;padding:12px}svg{display:block;width:100%;height:auto;min-height:480px}.alts{display:grid;gap:7px;margin-top:12px}.alt{text-align:right}.alt.active{border-color:#087f86;background:#edf8f8}.muted{color:#6c8290;font-size:10px}.progress{height:5px;background:#dce7eb;border-radius:20px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;width:0;background:#087f86}@media(max-width:760px){.app{grid-template-columns:1fr}.side{border-left:0;border-bottom:1px solid #d6e0e6}.canvas{min-height:330px}svg{min-height:300px}}
</style></head><body><div class="app"><aside class="side"><h2>مونتاج الفرخ</h2><div id="templateInfo" class="status">في انتظار القالب…</div><h3>الفرخ</h3><div class="grid"><label class="field"><span>العرض مم</span><input id="sw" type="number" value="1000"></label><label class="field"><span>الارتفاع مم</span><input id="sh" type="number" value="690"></label><label class="field"><span>البنسة</span><input id="grip" type="number" value="10"></label><label class="field"><span>الفاصل</span><input id="gap" type="number" value="3"></label><label class="field full"><span>الدوران</span><select id="rot"><option value="half">0° / 180°</option><option value="all">0° / 90° / 180° / 270°</option><option value="none">0° فقط</option></select></label><label class="field full"><span>مستوى البحث</span><select id="depth"><option value="fast">متوازن</option><option value="deep">موسع</option></select></label></div><button id="run" class="primary">بحث عن أفضل تعشيق</button><div class="progress"><i id="bar"></i></div><div id="status" class="status">جاهز</div><div id="alts" class="alts"></div></aside><main><div class="stage"><div class="stats"><div class="stat"><b id="count">—</b><span>قطعة/فرخ</span></div><div class="stat"><b id="util">—</b><span>استغلال هندسي</span></div><div class="stat"><b id="minGap">—</b><span>أقل فاصل</span></div></div><div class="muted">NFP + independent collision validation</div></div><div class="canvasWrap"><div class="canvas"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div></div></main></div>
<script src="./nest-engine-core.js"></script><script type="module">
import {prepareIrregularTemplate,buildConvexNFP,relativeRotations} from './nfp-lite.js';
let state={template:null,layout:[],result:null,index:0};const $=id=>document.getElementById(id),engine=globalThis.MahabaNestEngine;
function config(){const W=+$('sw').value,H=+$('sh').value,grip=+$('grip').value,gap=+$('gap').value,angles=$('rot').value==='all'?[0,90,180,270]:$('rot').value==='none'?[0]:[0,180];return {W:W-10,H:H-Math.max(grip,5)-5,clearance:gap,angles,deep:$('depth').value==='deep',sheetW:W,sheetH:H,offsetX:5,offsetY:Math.max(grip,5)};}
function polygonArea(p){return Math.abs(p.reduce((s,a,i)=>{const b=p[(i+1)%p.length];return s+a[0]*b[1]-a[1]*b[0]},0)/2)}
function render(layout=[]){const T=state.template,c=config(),svg=$('svg');svg.replaceChildren();svg.setAttribute('viewBox',`0 0 ${c.sheetW} ${c.sheetH}`);const ns='http://www.w3.org/2000/svg',rect=(x,y,w,h,attrs={})=>{const r=document.createElementNS(ns,'rect');for(const [k,v] of Object.entries({x,y,width:w,height:h,...attrs}))r.setAttribute(k,v);svg.append(r)};rect(0,0,c.sheetW,c.sheetH,{fill:'#fff',stroke:'#8ba0ad'});rect(0,0,c.sheetW,c.offsetY,{fill:'#f8efe1'});rect(c.offsetX,c.offsetY,c.W,c.H,{fill:'none',stroke:'#1d8890','stroke-dasharray':'7 4'});if(!T)return;const vs=engine.makeVariants(T);for(const [idx,a] of layout.entries()){const v=vs[a.r/90],g=document.createElementNS(ns,'g');g.setAttribute('transform',`translate(${a.x+c.offsetX} ${a.y+c.offsetY})`);const p=document.createElementNS(ns,'polygon');p.setAttribute('points',v.p.map(q=>q.join(',')).join(' '));p.setAttribute('fill','#dcebed');p.setAttribute('stroke','#173548');p.setAttribute('stroke-width','1');g.append(p);for(const line of v.creases){const l=document.createElementNS(ns,'polyline');l.setAttribute('points',line.map(q=>q.join(',')).join(' '));l.setAttribute('fill','none');l.setAttribute('stroke','#19a15a');l.setAttribute('stroke-width','.45');g.append(l)}const t=document.createElementNS(ns,'text');t.textContent=idx+1;t.setAttribute('x',v.w/2);t.setAttribute('y',v.h/2);t.setAttribute('text-anchor','middle');t.setAttribute('font-size','13');t.setAttribute('fill','#355b6d');g.append(t);svg.append(g)}}
function showResult(out,index=0){state.result=out;state.index=index;const r=out.results?.[index];if(!r){$('status').textContent='لا يوجد تعشيق صالح بهذه الإعدادات.';return}state.layout=r.layout.map(x=>({...x}));render(state.layout);$('count').textContent=state.layout.length;const c=config(),area=polygonArea(state.template.polygon);$('util').textContent=(state.layout.length*area/(c.sheetW*c.sheetH)*100).toFixed(1)+'%';const check=engine.validate(state.layout,out.variants,{W:c.W,H:c.H,clearance:c.clearance,angles:c.angles},true);$('minGap').textContent=Number.isFinite(check.min)?check.min.toFixed(2)+' mm':'—';$('status').textContent=r.name+' · تم التحقق من عدم وجود تداخل';$('alts').innerHTML='';out.results.forEach((a,i)=>{const b=document.createElement('button');b.className='alt'+(i===index?' active':'');b.innerHTML=`<b>${a.layout.length} قطعة</b><br><span class="muted">${a.name}</span>`;b.onclick=()=>showResult(out,i);$('alts').append(b)})}
async function run(){if(!state.template)return;$('status').textContent='جارٍ تجهيز NFP…';$('bar').style.width='12%';await new Promise(r=>requestAnimationFrame(r));try{const T=prepareIrregularTemplate(state.template),c=config(),rel=relativeRotations(c.angles),N=buildConvexNFP(T.cells,rel,p=>{$('status').textContent=p.stage;$('bar').style.width=(15+45*(p.done+1)/Math.max(1,p.total))+'%'});$('status').textContent='جارٍ تحسين التعشيق…';$('bar').style.width='65%';await new Promise(r=>setTimeout(r,0));const out=engine.solve(T,N,{W:c.W,H:c.H,clearance:c.clearance,angles:c.angles,deep:c.deep},p=>{$('bar').style.width=(65+35*(p.done/Math.max(1,p.total)))+'%';$('status').textContent=`تحسين التعشيق · أفضل نتيجة ${p.best||0} قطعة`});$('bar').style.width='100%';showResult(out,0)}catch(e){$('status').textContent=e.message;$('bar').style.width='0'}}
$('run').onclick=run;for(const id of ['sw','sh','grip','gap','rot','depth'])$(id).onchange=()=>render(state.layout);
window.importNesting=data=>{state.template=data.template;$('templateInfo').innerHTML=`<b>${state.template.code||'Template'}</b><br>${state.template.width.toFixed(1)} × ${state.template.height.toFixed(1)} mm`;if(data.layout?.length){state.layout=data.layout;render(state.layout)}else{state.layout=[];render([])};setTimeout(run,0)};
window.exportNesting=()=>({layout:state.layout,settings:{sw:+$('sw').value,sh:+$('sh').value,grip:+$('grip').value,gap:+$('gap').value,rot:$('rot').value,depth:$('depth').value}});
</script></body></html>
