<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mahabat Engine · Weekly PDF Prototype</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Tahoma,Arial,sans-serif;background:#09151f;color:#eef7f8}body{display:grid;grid-template-columns:290px 1fr;overflow:hidden}.panel{padding:18px;background:#102630;border-left:1px solid #29434f;overflow:auto}.panel h1{font-size:18px;margin:0 0 8px}.panel p{font-size:12px;line-height:1.7;color:#9cb1ba}.field{margin:12px 0}.field label{display:flex;justify-content:space-between;font-size:11px;margin-bottom:5px}.field input{width:100%;padding:9px;border:1px solid #355460;border-radius:8px;background:#0b1c25;color:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions button{padding:9px 12px;border:1px solid #3a625f;border-radius:8px;background:#123532;color:#dff8f4;cursor:pointer}.status{margin-top:14px;font-size:11px;color:#d8bb79;line-height:1.6}.workspace{min-width:0;display:grid;grid-template-rows:1fr auto;position:relative}.view{min-height:0}.view canvas{display:block;width:100%;height:100%}.foldbar{padding:12px 16px;background:#0d202a;border-top:1px solid #29434f;display:flex;gap:10px;align-items:center}.foldbar input{flex:1}.badge{display:inline-block;padding:5px 8px;border:1px solid #2f7069;border-radius:999px;font-size:10px;color:#78e2d6;margin-bottom:12px}@media(max-width:760px){body{grid-template-columns:1fr;grid-template-rows:auto 1fr}.panel{max-height:44vh;border-left:0;border-bottom:1px solid #29434f}.workspace{min-height:0}}
</style>
</head>
<body>
<aside class="panel">
<div class="badge">Mahabat Engineering Core · PDF Prototype</div>
<h1>قالب ويكلي</h1>
<p>نسخة اختبار داخل محرك مهابة مبنية من النسب الظاهرة في ملف PDF المرفوع. المقاسات الحالية تقريبية لحين إدخال الأبعاد الحقيقية أو ملف Vector.</p>
<div class="field"><label><span>العرض W</span><span>mm</span></label><input id="W" type="number" step="1" value="300"></div>
<div class="field"><label><span>الارتفاع H</span><span>mm</span></label><input id="H" type="number" step="1" value="298"></div>
<div class="field"><label><span>عمق الجوانب D</span><span>mm</span></label><input id="D" type="number" step="0.5" value="84.5"></div>
<div class="field"><label><span>عمق اللوح العلوي</span><span>mm</span></label><input id="top_depth" type="number" step="0.5" value="84.5"></div>
<div class="field"><label><span>الجزء السفلي الوسيط</span><span>mm</span></label><input id="lower_depth" type="number" step="0.5" value="88"></div>
<div class="field"><label><span>ارتفاع اللوح السفلي الطويل</span><span>mm</span></label><input id="bottom_h" type="number" step="1" value="298"></div>
<div class="field"><label><span>قطر الفتحة</span><span>mm</span></label><input id="hole_d" type="number" step="1" value="220"></div>
<div class="actions"><button id="rebuild">إعادة بناء</button><button id="flat">Flat</button><button id="closed">Fold</button></div>
<div id="status" class="status">جارٍ التحضير…</div>
</aside>
<main class="workspace">
<div id="view" class="view"></div>
<div class="foldbar"><span>الطي</span><input id="fold" type="range" min="0" max="1000" value="0"><span id="foldValue">0%</span></div>
</main>
<script type="module" src="./weekly.js"></script>
</body>
</html>
