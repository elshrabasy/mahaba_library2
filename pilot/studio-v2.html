<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mahabat Packaging Studio</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<link rel="stylesheet" href="../assets/studio/gallery-theme.css">
<style>
html,body{margin:0;min-height:100%;background:#07111c;color:#e6f0f3;font-family:Tahoma,Arial,sans-serif}body{overflow:hidden}.mahaba-head{height:72px;padding:0 22px;display:flex;align-items:center;gap:18px;background:#07131d;border-bottom:1px solid #1f3945}.mahaba-brand{font-weight:700;font-size:18px}.mahaba-brand small{display:block;margin-top:5px;color:#7898a7;font-size:10px;font-weight:400}.mahaba-project{margin-inline-start:auto;color:#9fb7c2;font-size:11px}.mahaba-back{background:#17313d;color:#dbecef;border:1px solid #36525e;border-radius:9px;padding:9px 13px;cursor:pointer}.ms-layout{height:calc(100vh - 72px);max-width:none!important;margin:0!important}.ms-layout #canvas3d{width:100%;height:100%;min-height:0;position:relative}.ms-layout #canvas3d canvas{width:100%;height:100%;display:block}.ms-layout .workspace>.view{flex:1;min-height:300px}.ms-layout .ms-fold-controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:10px;padding:10px;background:#102632;border-radius:10px}.ms-layout .ms-fold-controls input{flex:1;min-width:110px}.ms-layout .ms-fold-controls button,.ms-layout .ms-fold-controls select{width:auto}.ms-layout #modelStatus{font-size:11px;line-height:1.8;color:#edc97f;padding:7px}.ms-layout .panel-toolbar{flex:none}.ms-layout .ms-nesting-workspace{position:fixed!important;top:84px!important;right:92px!important;left:18px!important;bottom:18px!important;width:auto!important;height:auto!important;min-height:0!important;z-index:200!important;display:flex!important;flex-direction:column!important;overflow:hidden!important;background:#edf3f5!important;border:1px solid #d4e0e5!important;border-radius:16px!important;box-shadow:0 18px 55px rgba(4,24,35,.22)!important}.ms-layout .ms-nesting-workspace[hidden]{display:none!important}.ms-layout .ms-nesting-workspace>.toolbar{height:52px!important;flex:0 0 52px!important;margin:0!important;padding:8px 12px!important;background:#102f3d!important;color:#fff!important;border-bottom:2px solid #c3a45f!important}.ms-layout .ms-nest{display:block!important;flex:1 1 auto!important;width:100%!important;height:calc(100% - 52px)!important;min-height:0!important;border:0!important;background:#edf3f5!important}@media(max-width:760px){body{overflow:auto}.mahaba-head{height:auto;min-height:62px;padding:10px 12px}.mahaba-project{display:none}.ms-layout{height:auto;min-height:calc(100vh - 62px)}.ms-layout .workspace>.view{min-height:430px}.ms-layout .ms-nesting-workspace{top:68px!important;right:8px!important;left:8px!important;bottom:8px!important;border-radius:10px!important}}
</style>
</head>
<body>
<header class="mahaba-head"><div class="mahaba-brand">MAHABAT · Packaging Studio<small>Mahaba Library Studio · Geometry by Mahabat Engine</small></div><div class="mahaba-project">EVC11001 · Native pilot</div><button id="back" class="mahaba-back">العودة</button></header>
<main class="ms-layout">
  <nav id="studioRail"></nav>
  <aside id="studioInspector"></aside>
  <section id="studioWorkspace" class="workspace">
    <div class="toolbar"><button data-id="three">معاينة الطي</button><button data-id="two">الرسم المسطح</button><button data-id="splitView">الرسم + المجسم</button><button data-id="exportSvg">SVG</button><button data-id="exportPdf">PDF 1:1</button></div>
    <div class="view"><div id="canvas3d"></div></div>
    <div class="panel-toolbar"><label>الجزء <select data-id="drawing"></select></label><label>جهة الطباعة <select data-id="side"><option value="outside">الخارج</option><option value="inside">الداخل</option></select></label><span data-id="coverage"></span></div>
    <div class="ms-fold-controls"><button id="foldFlat">Flat</button><input id="fold" type="range" min="0" max="1000" value="1000"><button id="foldClosed">Closed</button><select id="foldPhase"><option value="all">كل الطيات</option><option value="0">Body</option><option value="1">Bottom</option><option value="2">Top</option></select></div>
    <div id="modelStatus" class="studio-status">جارٍ التحضير…</div>
  </section>
</main>
<script type="module" src="./studio-v2.js"></script>
</body></html>
