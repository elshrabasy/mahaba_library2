@media(max-width:760px){:root{--head-h:58px;--mobile-rail:66px}.mahaba-head{height:var(--head-h)!important;padding:0 8px!important;gap:6px!important}.mahaba-brand{font-size:12px;max-width:35vw;overflow:hidden;text-overflow:ellipsis}.mahaba-brand small,.mahaba-project,.mahaba-template-switch label,.mahaba-core-badge{display:none!important}.mahaba-template-switch{margin-inline-start:auto;padding:2px;background:transparent;border:0}.mahaba-template-switch select{min-width:0;width:34vw;height:32px;font-size:9px}.mahaba-back{padding:7px 8px!important;font-size:9px!important}.ms-layout{height:calc(100dvh - var(--head-h))!important;display:block!important;padding:6px 6px calc(var(--mobile-rail) + 9px)!important}.ms-layout #studioRail{position:fixed!important;z-index:500!important;right:6px!important;left:6px!important;bottom:max(6px,env(safe-area-inset-bottom))!important;top:auto!important;width:auto!important;height:var(--mobile-rail)!important;display:flex!important;flex-direction:row!important;align-items:stretch!important;gap:2px!important;padding:5px!important;border-radius:16px!important;background:#102630ef!important;backdrop-filter:blur(16px)!important;overflow:hidden!important}.ms-layout #studioRail button{flex:1 1 0!important;min-width:0!important;height:56px!important;min-height:0!important;padding:4px 1px!important;font-size:6.5px!important}.ms-layout #studioRail button svg{width:18px!important;height:18px!important}.ms-layout #studioInspector{position:fixed!important;z-index:480!important;right:8px!important;left:8px!important;bottom:calc(var(--mobile-rail) + 14px + env(safe-area-inset-bottom))!important;top:auto!important;width:auto!important;height:auto!important;max-height:58dvh!important;border-radius:18px!important;box-shadow:0 18px 55px #0009!important;background:#132a35f5!important;backdrop-filter:blur(18px)!important}.ms-layout.inspector-closed #studioInspector{display:none!important}.ms-layout .inspector-heading{position:sticky!important;top:0!important;z-index:5!important;padding:10px 12px 9px!important;background:#17303bf2!important}.ms-layout .workspace{height:100%!important}.ms-layout .workspace>.toolbar{min-height:38px!important;margin-bottom:6px!important;gap:5px!important}.ms-layout .workspace>.toolbar button{padding:7px 8px!important;font-size:8px!important}.ms-layout .workspace>.view{border-radius:12px!important}.ms-layout .panel-toolbar{min-height:33px!important;margin-top:5px!important;padding:5px 7px!important}.ms-layout .ms-fold-controls{min-height:36px!important;margin-top:5px!important;padding:5px 7px!important}.ms-layout #modelStatus{font-size:7.5px!important}.ms-layout .ms-nesting-workspace{top:var(--head-h)!important}}

<body>
<header class="mahaba-head">
  <a class="atelier-brand" href="../" aria-label="مهابة · المكتبة">
    <svg viewBox="0 0 42 44" fill="none" aria-hidden="true"><path d="m21 2 18 10v21L21 43 3 33V12L21 2Z" stroke="currentColor" stroke-width="1.5"/><path d="m3 12 18 10 18-10M21 22v21M12 7l18 10v11l-9 5" stroke="currentColor" stroke-width="1.5"/></svg>
    <span class="mahaba-brand">مهابة<small>PACKAGING ATELIER</small></span>
  </a>
  <div class="atelier-divider"></div>
  <div class="atelier-project"><span data-experience="workspace">مساحة العمل</span><div id="projectLabel" class="mahaba-project">استوديو التغليف</div></div>
  <div class="mahaba-template-switch"><label for="templateSwitch" data-experience="template">القالب الحالي</label><select id="templateSwitch"><option value="EVC11001">EVC11001 · Snap Lock</option><option value="STE">Straight Tuck End</option></select></div>
  <span id="coreBadge" class="mahaba-core-badge">Mahabat Engine</span>
  <div class="atelier-head-actions">
    <button type="button" id="headerOpen" class="atelier-icon-button" aria-label="فتح مشروع" title="فتح مشروع"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 7h7l2 3h9l-3 10H3V7Z"/><path d="M3 10h18M3 7V4h7l2 3h8v3"/></svg></button>
    <button type="button" id="headerSave" class="atelier-save"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 3h13l3 3v15H4V3Z"/><path d="M8 3v6h8V3M8 21v-8h8v8"/></svg><span data-experience="save">حفظ المشروع</span></button>
    <details id="studioExportMenu" class="atelier-export"><summary><span data-experience="export">تصدير</span><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m6 8 4 4 4-4"/></svg></summary><div class="atelier-export-options"><button type="button" data-studio-export="svg">SVG <span data-experience="vector">رسم متجهي</span></button><button type="button" data-studio-export="pdf">PDF <span data-experience="print">طباعة 1:1</span></button></div></details>
    <button type="button" id="back" class="mahaba-back">العودة</button>
  </div>
</header>
<nav class="atelier-flow" aria-label="مراحل المشروع"><span class="atelier-flow-caption" data-experience="journey">من الفكرة إلى الإنتاج</span><button type="button" data-studio-step="dimensions" aria-current="step"><b>01</b><span data-experience="build">بناء القالب</span></button><i></i><button type="button" data-studio-step="art"><b>02</b><span data-experience="design">التصميم والتشطيب</span></button><i></i><button type="button" data-studio-step="nest"><b>03</b><span data-experience="nest">المونتاج</span></button><i></i><button type="button" data-studio-step="production"><b>04</b><span data-experience="production">الإنتاج</span></button><span class="atelier-ready"><i></i><span id="studioReady" role="status" data-experience="loading">نجهّز مساحة إبداعك</span></span></nav>
<main class="ms-layout" aria-busy="true">
  <nav id="studioRail"></nav>
  <button type="button" id="studioBackdrop" class="atelier-backdrop" aria-label="إغلاق لوحة الأدوات" hidden></button>
  <aside id="studioInspector"></aside>
  <section id="studioWorkspace" class="workspace">
    <div class="atelier-workspace-heading"><div><span class="atelier-eyebrow">THE WORKBENCH</span><h1 data-experience="preview">مساحة المعاينة</h1><p data-experience="subtitle">تفاصيل أوضح. وقرارات أسهل.</p></div><button type="button" id="studioPanelToggle" class="atelier-panel-toggle" aria-controls="studioInspector" aria-expanded="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16"/></svg><span data-experience="tools">الأدوات</span></button></div>
    <div class="toolbar atelier-viewbar"><div class="atelier-view-tabs" role="group" aria-label="طريقة العرض"><button type="button" data-id="three">معاينة الطي</button><button type="button" data-id="two">الرسم المسطح</button><button type="button" data-id="splitView">الرسم + المجسم</button></div><div class="atelier-export-originals" hidden><button data-id="exportSvg">SVG</button><button data-id="exportPdf">PDF 1:1</button></div><span class="atelier-view-note" data-experience="interactive">معاينة تفاعلية</span></div>
    <div class="view">
      <div id="canvas3d"></div>
      <div class="atelier-canvas-label"><span class="atelier-live-dot"></span><span id="studioViewLabel">ثلاثي الأبعاد</span></div>
      <div class="atelier-canvas-tools"><button type="button" id="studioDimensions" aria-label="إخفاء المقاسات" aria-pressed="true" title="إخفاء المقاسات" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m4 16 12-12 5 5L9 21l-5-5Z M7 13l2 2m1-5 2 2m1-5 2 2"/></svg></button><button type="button" id="studioFit" aria-label="توسيط المجسم" title="توسيط المجسم · F"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/><rect x="7" y="7" width="10" height="10" rx="2"/></svg></button><button type="button" id="studioFocus" aria-label="توسيع المعاينة" aria-pressed="false" title="توسيع المعاينة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M9 3H3v6m12-6h6v6M3 15v6h6m12-6v6h-6"/></svg></button></div>
      <div class="atelier-gesture" data-experience="gesture">اسحب للدوران <span>·</span> مرّر للتقريب</div>
    </div>
    <div class="atelier-settings-row"><div class="panel-toolbar"><label>الجزء <select data-id="drawing"></select></label><label>جهة الطباعة <select data-id="side"><option value="outside">الخارج</option><option value="inside">الداخل</option></select></label><span data-id="coverage"></span></div><div class="ms-fold-controls"><button id="foldFlat">Flat</button><input id="fold" aria-label="مقدار الطي" type="range" min="0" max="1000" value="1000"><button id="foldClosed">Closed</button><select id="foldPhase" aria-label="مرحلة الطي"><option value="all">كل الطيات</option><option value="0">Body</option><option value="1">Bottom</option><option value="2">Top</option></select></div></div>
    <footer class="atelier-statusbar"><span class="atelier-dimensions" id="studioDimensionSummary">EVC11001</span><div id="modelStatus" class="studio-status" role="status" aria-live="polite">جارٍ التحضير…</div><span class="atelier-units">mm</span></footer>
  </section>
</main>
