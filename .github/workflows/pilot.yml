name: Mahabat pilot

on:
  push:
    branches: [engine-integration-v1]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Check browser studio modules
        run: |
          node --check pilot/pilot.js
          node --check pilot/studio-v2.js
          node --check pilot/core-v1.js
          node --check studio-src/mahabat-shared-studio.js
          node --check studio-src/engineering-panel.js
          node --check studio-src/production-link.js
          node --check studio-src/generator-experience.js
          node --check studio-src/studio-preferences.js
          node --check studio-src/studio-ui-controller.js
          node --check studio-src/shared-studio.js
          node --check studio-src/studio-core.js
          node --check studio-src/native_runtime.js
          node --check studio-src/native_gpu.js
          node --check studio-src/nest-engine-core.js
          node --check studio-src/nest-patterns.js
          node --check studio-src/nest-smart-rotation.js
          node --check studio-src/nest-ga-optimizer.js
          node --check studio-src/nest-worker-module.js
          node --check studio-src/nesting-bridge.js
          node --check engine/mahabat-native.js
          node --check engine/registry.js
          node --check core/geometry/kernel.js
          node --check core/metrics/engine.js
          node --check core/folding/graph.js
          node --check core/validation/engine.js
          node --check core/cost/engine.js
          node --check core/machines/engine.js
          node --check engines/nesting/orchestrator.js
          node --check engines/production/optimizer.js
          node --check services/engineering-core.js
          node --check templates/straight-tuck-end/generate.js
