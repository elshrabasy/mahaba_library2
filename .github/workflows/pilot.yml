name: Mahabat pilot

on:
  push:
    branches: [engine-integration-v1]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Check browser pilot modules
        run: |
          node --check pilot/pilot.js
          node --check studio-src/native_runtime.js
          node --check studio-src/native_gpu.js
          node --check studio-src/nest-engine-core.js
          node --check studio-src/nesting-bridge.js
          node --check engine/mahabat-native.js
